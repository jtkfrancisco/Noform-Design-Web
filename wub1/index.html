<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WUB-1</title>
<meta name="description" content="WUB-1 by Noform. A pocket drop maker for riddim and wub bass.">
<meta name="theme-color" content="#08090c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WUB-1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: one-screen phone instrument. Fixed top bar, labelled overview strip, layer tabs, layer bar, then the play surface fills the rest. Setup lives in a bottom sheet. Single dark theme by design. */
:root{
  --bg:#08090c; --panel:#11141a; --panel2:#191d26; --line:#2c3240;
  --fg:#eef1f6; --mute:#bcc3d3; --dim:#8c94a8;
  --acc:#b67cff; --go:#4dffb8; --rec:#ff4d5e; --q:#ffb84d;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--sans);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{height:100%;min-height:560px;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 10px}

/* Top bar: never wraps */
.top{display:flex;align-items:center;gap:6px}
.tb{height:48px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);font:700 15px var(--sans);padding:0 10px;white-space:nowrap}
.tb.play{min-width:68px}
.tb.play.on{border-color:var(--go);color:var(--go)}
.tb.rec{min-width:62px;border-color:var(--rec);color:var(--rec)}
.tb.rec.live{background:var(--rec);color:#fff}
.tb.rec.wait{background:transparent;border-style:dashed}
.secs{display:flex;gap:4px;flex:1;justify-content:center;min-width:0}
.sec{position:relative;flex:1;max-width:46px;height:48px;border-radius:10px;border:2px solid var(--line);background:var(--bg);font:700 17px var(--mono);color:var(--dim);padding:0}
.sec.has{color:var(--mute)}
.sec.on{border-color:var(--go);color:var(--go);background:rgba(77,255,184,.08)}
.sec.q{border-color:var(--q);color:var(--q)}
.sec .dot{position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:currentColor}
.bpmb{height:48px;min-width:56px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:0 6px}
.bpmb b{font:700 17px var(--mono)}
.bpmb small{font:600 11px var(--sans);color:var(--mute);margin-top:3px}

.screen{background:#000;border:1px solid var(--line);border-radius:12px;overflow:hidden;flex:none}
#strip{display:block;width:100%;height:76px}
.status{font:600 14px var(--sans);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:20px;flex:none}
.status.rec{color:var(--rec)} .status.ok{color:var(--go)}

.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;flex:none}
.tab{height:50px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-bottom:4px solid var(--lc);padding:0 2px;min-width:0}
.tab b{font:700 15px var(--sans)}
.tab small{font:600 12px var(--sans);color:var(--dim);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab.on{background:var(--panel2);border-color:var(--lc);box-shadow:0 0 0 1px var(--lc) inset}
.tab.on small{color:var(--mute)}
.tab.muted b{text-decoration:line-through;color:var(--dim)}

.lbar{display:flex;gap:6px;align-items:stretch;flex:none}
.soundbtn{flex:1;min-width:0;height:48px;border-radius:12px;border:1px solid var(--cc);background:var(--panel);display:flex;align-items:center;gap:8px;padding:0 12px;text-align:left}
.soundbtn b{font:700 16px var(--sans);color:var(--cc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.soundbtn span{margin-left:auto;font:600 14px var(--sans);color:var(--mute);white-space:nowrap}
.lb{height:48px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font:600 14px var(--sans);color:var(--mute);white-space:nowrap}
.lb.on{border-color:var(--rec);color:var(--rec)}
.lb.live{border-color:var(--cc);color:var(--fg);background:var(--panel2)}

/* Play surface fills the rest */
.surface{flex:1;min-height:230px;display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:8px;touch-action:none;user-select:none;-webkit-user-select:none}
.pads{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,minmax(0,1fr));gap:6px}
.pad{border-radius:12px;border:1px solid var(--line);background:linear-gradient(180deg,#1c2131,#141824);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:none;min-height:0}
.pad b{font:700 19px var(--mono)}
.pad small{font:600 12px var(--sans);color:var(--dim)}
.pad.root b{color:var(--go)}
.pad.down{background:var(--cc);border-color:#fff;box-shadow:0 0 20px var(--cc)}
.pad.down b,.pad.down small{color:#0b0712}
.xyw{position:relative;min-height:0;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
#xy{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.dsurf{flex:1;min-height:230px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;touch-action:none;user-select:none;-webkit-user-select:none}
.dpad{border-radius:16px;border:1px solid var(--line);border-bottom:6px solid var(--dc);background:linear-gradient(180deg,#1c2131,#141824);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;touch-action:none;min-height:0}
.dpad b{font:700 22px var(--sans);color:var(--dc)}
.dpad small{font:600 13px var(--sans);color:var(--dim)}
.dpad.down{background:var(--dc)}
.dpad.down b,.dpad.down small{color:#0b0712}

/* Setup sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:19}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:84%;z-index:20;background:var(--panel);border-top:3px solid var(--cc);border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.6)}
.sheet .hd{display:flex;gap:6px;align-items:center;padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);max-width:760px;width:100%;margin:0 auto}
.seg{height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font:700 15px var(--sans);color:var(--mute)}
.seg.on{border-color:var(--cc);color:var(--fg);background:var(--panel2)}
.done{margin-left:auto;height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--go);background:transparent;color:var(--go);font:700 15px var(--sans)}
.sheet .bd{overflow:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-width:760px;width:100%;margin:0 auto}
.grp{display:flex;flex-direction:column;gap:8px}
.gt{font:700 14px var(--sans);color:var(--mute)}
.sounds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.snd{height:48px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font:700 14px var(--sans);color:var(--mute);padding:0 4px}
.snd.on{border-color:var(--cc);color:var(--fg);background:var(--panel2);box-shadow:0 0 0 1px var(--cc) inset}
.desc{font-size:15px;color:var(--mute);margin:0;max-width:60ch}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font:600 15px var(--sans);color:var(--mute)}
.btn.on{border-color:var(--cc);color:var(--fg);background:var(--panel2)}
.btn.danger{color:var(--rec);border-color:#5a2730}
.sq{width:48px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font:700 20px var(--mono)}
.num{font:700 20px var(--mono);min-width:48px;text-align:center;font-variant-numeric:tabular-nums}
.kn{display:grid;grid-template-columns:84px minmax(0,1fr) 56px;gap:10px;align-items:center}
.kn label{font:700 14px var(--sans);color:var(--mute)}
.kn output{font:600 15px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:#283040}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:#283040}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-11px;border-radius:50%;background:#eee8f8;border:4px solid var(--cc,var(--acc))}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#eee8f8;border:4px solid var(--cc,var(--acc))}
select{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);padding:0 10px;font:600 15px var(--sans)}
.dgrid{display:grid;grid-template-columns:52px repeat(16,minmax(0,1fr));gap:2px}
.dgrid .l{font:700 13px var(--sans);align-self:center;color:var(--dc)}
.dgrid .c{height:32px;border-radius:3px;background:#1b202b}
.dgrid .c.b{background:#262d3c}
.dgrid .c.on{background:var(--dc);box-shadow:0 0 6px var(--dc)}
.dgrid .c.ph{outline:2px solid rgba(255,255,255,.55);outline-offset:-2px}
.part{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.prow{display:flex;align-items:center;gap:5px}
.pnum{font:700 14px var(--mono);color:var(--dim);min-width:18px}
.psec{width:48px;height:44px;border-radius:10px;border:2px solid var(--sc);background:transparent;color:var(--sc);font:700 18px var(--mono)}
.pbars{font:700 14px var(--mono);min-width:58px;text-align:center;font-variant-numeric:tabular-nums}
.moves{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.sq.ps{width:40px}
.chip2{width:100%;height:40px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font:600 13px var(--sans);color:var(--mute)}
.chip2.on{border-color:var(--q);color:var(--q);background:var(--panel2)}
.btn:disabled{opacity:.45}
.rollw{border-radius:10px;overflow:hidden;border:1px solid var(--line)}
#roll{display:block;width:100%;height:272px;touch-action:none}
.slots{display:flex;flex-direction:column;gap:6px}
.slot{display:flex;align-items:center;gap:6px;padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.slot.empty .sinfo b{color:var(--dim)}
.sinfo{flex:1;min-width:0;display:flex;flex-direction:column}
.sinfo b{font:700 15px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sinfo small{font:600 13px var(--sans);color:var(--dim)}
.err{background:#2a1418;border:1px solid var(--rec);padding:12px;border-radius:10px}
/* ═══ Desktop pro view ═══ */
#desk{display:none}
body.desk .app{display:none}
body.desk #desk{display:grid;height:100%;grid-template-columns:250px minmax(0,1fr) 300px;grid-template-rows:56px minmax(0,1fr) 300px;gap:1px;background:#000}
.dp{background:var(--panel);min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.dph{height:36px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--line);font:700 14px var(--sans);color:var(--fg);background:#151820;white-space:nowrap;overflow:hidden}
.dpb{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:14px}
#dtool{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:0 14px;background:#12151b;overflow-x:auto;white-space:nowrap}
.dbrand{display:flex;flex-direction:column;line-height:1.05;margin-right:8px}
.dbrand b{font:700 18px var(--mono);color:var(--fg)}
.dbrand span{font:600 11px var(--sans);color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.dt{height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font:600 14px var(--sans);color:var(--fg);white-space:nowrap}
.dt:hover{border-color:#4a5368}
.dt.on{border-color:var(--cc,var(--go));color:var(--cc,var(--go))}
.dt.mv{border-color:var(--q);color:var(--q)}
.dt.rec{border-color:var(--rec);color:var(--rec)}
.dt.rec.live{background:var(--rec);color:#fff}
.dt.danger{color:var(--rec);border-color:#5a2730}
.dsq{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font:700 16px var(--mono);color:var(--fg)}
.dsep{width:1px;height:28px;background:var(--line);margin:0 4px}
.dsecs{display:flex;gap:4px}
.dsec{width:36px;height:36px;border-radius:8px;border:2px solid var(--line);background:var(--bg);font:700 16px var(--mono);color:var(--mute)}
.dsec.on{border-color:var(--sc);color:var(--sc)}
.dsec.q{border-style:dashed;border-color:var(--q);color:var(--q)}
.dtime{font:600 14px var(--mono);color:var(--go);min-width:210px;margin-left:8px}
.dbpm{display:flex;align-items:center;gap:6px}
.dbpm div{display:flex;flex-direction:column;align-items:center;line-height:1;min-width:40px}
.dbpm b{font:700 17px var(--mono)} .dbpm small{font:600 11px var(--sans);color:var(--dim)}
#desk select{height:36px;border-radius:8px;font-size:14px}
.pcard{border:1px solid var(--line);border-left:4px solid var(--sc);border-radius:10px;background:var(--bg);padding:8px;display:flex;flex-direction:column;gap:6px;cursor:grab}
.pcard.on{border-color:var(--sc);box-shadow:0 0 0 1px var(--sc) inset}
.pct{display:flex;align-items:center;gap:8px}
.pct b{font:700 18px var(--mono);color:var(--sc)}
.pct span{font:600 13px var(--sans);color:var(--dim)}
.dmini{margin-left:auto;height:26px;padding:0 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);font:600 12px var(--sans);color:var(--mute)}
.dmini.on{border-color:var(--rec);color:var(--rec)}
.thumb{display:block;width:100%;height:54px;border-radius:6px}
.dgroup{display:flex;flex-direction:column;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.dgroup:last-child{border-bottom:0}
.dgt{font:700 15px var(--sans);color:var(--fg)}
.dgt2{font:700 13px var(--sans);color:var(--mute)}
.dgrid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.drow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font:600 14px var(--sans);color:var(--mute)}
.dnum{font:700 15px var(--mono);min-width:72px;text-align:center}
.dhint{font:500 13px/1.45 var(--sans);color:var(--mute);margin:0}
.dmix{display:grid;grid-template-columns:62px 30px minmax(0,1fr);gap:8px;align-items:center;font:700 13px var(--sans)}
.dmix .dmini{margin:0}
#desk input[type=range]{height:30px}
#desk input[type=range]::-webkit-slider-thumb{width:20px;height:20px;margin-top:-6px;border-width:3px}
#desk input[type=range]::-webkit-slider-runnable-track{height:6px}
.dvtabs{gap:6px}
.dvt{height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--line);border-bottom:3px solid var(--lc);background:var(--bg);font:700 13px var(--sans);color:var(--mute)}
.dvt.on{background:var(--panel2);color:var(--fg);border-color:var(--lc)}
.dvt.muted{text-decoration:line-through}
kbd{font:600 11px var(--mono);color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px}
.dvsec{font:700 14px var(--mono)}
.dstatus{font:600 13px var(--sans);color:var(--mute);overflow:hidden;text-overflow:ellipsis;min-width:0;margin-left:8px}
.dstatus.rec{color:var(--rec)} .dstatus.ok{color:var(--go)}
#dvbody{flex:1;min-height:0;display:flex}
.dvsplit{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:minmax(0,1fr);gap:14px;padding:14px}
.dvleft{display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0}
.dvrollw{flex:1;min-height:0;position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.dvrollw canvas,.dvgridw canvas,.dvxy canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.dvxy{height:100%;aspect-ratio:1/1;max-width:100%;position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.dnpads{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;height:64px;flex:none}
.dnpads .pad{min-height:0}
.dvdrums{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding:14px}
.dvgridw{flex:1;min-height:0;position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ddpads{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;height:110px;flex:none}
#dtl{grid-column:1/-1}
.dtlhint{font-weight:500;color:var(--dim);overflow:hidden;text-overflow:ellipsis}
.dtlbody{flex:1;min-height:0;display:grid;grid-template-columns:150px minmax(0,1fr)}
#dtlhead{border-right:1px solid var(--line);background:#12151b}
.tlh{display:flex;align-items:center;gap:6px;padding:0 10px;font:700 13px var(--sans);color:var(--mute);border-bottom:1px solid #1d222d}
.tlh .dmini{margin-left:auto}
#dtlscroll{overflow-x:auto;overflow-y:hidden;position:relative}
#tl{display:block;height:242px;touch-action:none;cursor:default}
body.desk .sheet{left:50%;right:auto;bottom:auto;top:6vh;transform:translateX(-50%);width:min(620px,92vw);max-height:86vh;border-radius:16px;border:1px solid var(--line);border-top:3px solid var(--cc)}
body.desk .sheet .hd,body.desk .sheet .bd{padding-left:16px;padding-right:16px}
/* ═══ Desktop polish ═══ */
body.desk{--d0:#0b0c0f;--d1:#14161b;--d2:#1c1f26;--d3:#262a33;--hair:rgba(255,255,255,.08);--t1:#f3f4f7;--t2:#b4bac6;--t3:#8e95a5;background:var(--d0)}
body.desk #desk{grid-template-rows:64px minmax(0,1fr) 300px;background:var(--hair)}
body.desk .dp{background:var(--d1)}
body.desk .dph{height:40px;background:var(--d1);border-bottom:1px solid var(--hair);font:600 13px var(--sans);color:var(--t2);letter-spacing:.01em;padding:0 14px}
body.desk .dpb{padding:12px;gap:12px}
#dtool{background:linear-gradient(#17191f,#121418);gap:10px;padding:0 16px;border-bottom:1px solid var(--hair)}
.dbrand{margin-right:6px}.dbrand b{font:700 17px var(--mono);letter-spacing:.02em}.dbrand span{font:600 11px var(--sans);color:var(--t3)}
.tgroup{display:flex;align-items:center;gap:2px;padding:3px;border-radius:11px;background:var(--d0);border:1px solid var(--hair)}
.tbtn{height:34px;padding:0 13px;border-radius:8px;border:0;background:transparent;font:600 14px var(--sans);color:var(--t1);white-space:nowrap;transition:background .12s,color .12s}
.tbtn:hover{background:var(--d3)}
.tbtn.sq{width:34px;padding:0;font-size:18px}
.tbtn.on{background:rgba(77,255,184,.16);color:var(--go)}
.tbtn.rec{color:#ff7482}
.tbtn.rec.live{background:var(--rec);color:#fff}

 {id:"prop",n:"Propeller",d:"A tight sine with its volume chopped fast. Drag right for a faster ruhhh.",o1:"sine",o2:"sine",o2x:2,mix:.2,det:0,ft:"lowpass",q:1,drive:.15,glide:.06,mod:"am",depth:.95,retrig:false,e:env(.005,.03)},

  wrap.addEventListener("dblclick",e=>{if(e.target.id!=="tl")return;const p=tlPos(e),lane=laneAt(p.y);
    if(lane==="fx"){const f=fxAt(p.x,p.y);if(f){S.fx.splice(S.fx.indexOf(f),1);ui.selFx=null;save();touch();}return;}
    if(lane!=="filter"&&lane!=="vol")return;
    const arr=S.auto[lane]||[],i=arr.findIndex(k=>Math.abs(k.bar*ui.barPx-p.x)<8);if(i>=0){arr.splice(i,1);ui.selKey=null;save();touch();}});
  wrap.addEventListener("wheel",e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();ui.barPx=Math.max(8,Math.min(96,ui.barPx*(e.deltaY<0?1.12:.89)));const z=$("#dzoom");if(z){z.value=ui.barPx;z.style.setProperty("--p",Math.round((ui.barPx-8)/88*100)+"%");}sizeTimeline();fitTL();}
    else if(!e.shiftKey&&Math.abs(e.deltaY)>Math.abs(e.deltaX)){wrap.scrollLeft+=e.deltaY;e.preventDefault();}},{passive:false});
  wrap.addEventListener("dragover",e=>{if(e.dataTransfer.types.includes("text/wub-fx")){e.preventDefault();const pp=tlPos(e);dropFx=snapQ(pp.x/ui.barPx);dropFxRow=laneAt(pp.y)==="fx"?fxRowAt(pp.y):0;return;}if(!e.dataTransfer.types.includes("text/wub-sec"))return;e.preventDefault();const p=tlPos(e);dropX=insertX(insertIndexAt(p.x,-1),-1);});
  wrap.addEventListener("dragleave",()=>{dropX=null;dropFx=null;});
  wrap.addEventListener("drop",e=>{const fid=e.dataTransfer.getData("text/wub-fx");if(fid){e.preventDefault();const pp=tlPos(e),o={id:fid,bar:snapQ(pp.x/ui.barPx),vol:1,pitch:0,row:null};const want=laneAt(pp.y)==="fx"?fxRowAt(pp.y):0,len=fxBars(o);o.row=!S.fx.some(q=>q.row===want&&q.bar<o.bar+len&&fxEnd(q)>o.bar)?want:freeRow(o.bar,len,o);S.fx.push(o);ui.selFx=o;ui.selClip=null;ui.selKey=null;dropFx=null;loadFx();save();touch();return;}
    const s=e.dataTransfer.getData("text/wub-sec");dropX=null;if(s==="")return;e.preventDefault();const p=tlPos(e),idx=insertIndexAt(p.x,-1);S.song.splice(idx,0,newPart(+s));ui.selClip=idx;save();touch();});
}

// ── Viewer input (roll, drum grid, xy, pads) ──
let rollDragD=null;
function rollCellD(e){const c=cvs.rollD;if(!c)return null;const r=c.getBoundingClientRect(),W=c.clientWidth,H=c.clientHeight,lbw=52,n=L(),x=e.clientX-r.left,y=e.clientY-r.top;
  return{s:Math.max(0,Math.min(n-1,Math.floor((x-lbw)/((W-lbw)/n)))),row:7-Math.max(0,Math.min(7,Math.floor(y/(H/8)))),inGrid:x>=lbw};}
function bindViewer(){
  const vb=$("#dvbody");
  vb.addEventListener("pointerdown",async e=>{
    const t=e.target;
    if(t.id==="rollD"){e.preventDefault();const li=tabLi();if(li<0)return;if(!A){try{await ensureAudio();}catch(x){}}
      const p=rollCellD(e);if(!p||!p.inGrid)return;try{t.setPointerCapture(e.pointerId);}catch(x){}
      const tr=lay(li).track,run=runAt(tr,p.s);
      if(run&&run.n===p.row)rollDragD={li,a:run.a,e:run.b,n:run.n,mode:p.s===run.b?"end":"body",moved:false,startCol:p.s};
      else{writeRun(li,p.s,p.s,p.row);rollDragD={li,a:p.s,e:p.s,n:p.row,mode:"new",moved:false,startCol:p.s};preview(li,p.row);S.example=false;save();touch();}
      return;}
    if(t.id==="dgridD"){e.preventDefault();const r=t.getBoundingClientRect(),W=t.clientWidth,H=t.clientHeight,lbw=70,x=e.clientX-r.left,y=e.clientY-r.top;if(x<lbw)return;
      const s=Math.max(0,Math.min(15,Math.floor((x-lbw)/((W-lbw)/16)))),ri=Math.max(0,Math.min(3,Math.floor(y/(H/4)))),id=DROWS[ri].id,d=sec().drums;d[id][s]=!d[id][s];save();touch();return;}
    if(t.id==="xyD"){e.preventDefault();const li=tabLi();if(li<0)return;try{t.setPointerCapture(e.pointerId);}catch(x){}V[li].xyTouch=true;if(!A){try{await ensureAudio();}catch(x){}}setXYD(t,e);return;}
    const p=t.closest(".pad,.dpad");if(!p)return;e.preventDefault();try{p.setPointerCapture(e.pointerId);}catch(x){}p.classList.add("down");
    if(!A){try{await ensureAudio();}catch(x){return showErr(x);}}
    if(p.classList.contains("dpad")){drumTap(p.dataset.r);setTimeout(()=>p.classList.remove("down"),110);return;}
    const li=tabLi(),i=+p.dataset.i;V[li].held.push({i,id:e.pointerId});liveOn(li,i);
  });
  vb.addEventListener("pointermove",e=>{
    if(e.target.id==="xyD"){const li=tabLi();if(li>=0&&V[li].xyTouch)setXYD(e.target,e);return;}
    if(!rollDragD||e.target.id!=="rollD")return;const p=rollCellD(e);if(!p)return;const d=rollDragD;
    if(p.s===d.startCol&&!d.moved)return;if(d.mode==="body"){d.moved=true;return;}
    d.moved=true;const ne=Math.max(d.a,Math.min(L()-1,p.s));if(ne<d.e)clearRange(d.li,ne+1,d.e);if(ne!==d.e){writeRun(d.li,d.a,ne,d.n);d.e=ne;}
  });
  const up=e=>{
    if(rollDragD){const d=rollDragD;rollDragD=null;if(!d.moved&&(d.mode==="body"||d.mode==="end"))clearRange(d.li,d.a,d.e);S.example=false;save();touch();}
    if(e.target&&e.target.id==="xyD"){const li=tabLi();if(li>=0)V[li].xyTouch=false;save();}
    const li=tabLi();if(li<0)return;const v=V[li],k=v.held.findIndex(h=>h.id===e.pointerId);if(k<0)return;const i=v.held[k].i;v.held.splice(k,1);
    if(!v.held.some(h=>h.i===i)){const el=vb.querySelector('.pad[data-i="'+i+'"]');el&&el.classList.remove("down");}if(A)liveOff(li);
  };
  vb.addEventListener("pointerup",up);vb.addEventListener("pointercancel",up);vb.addEventListener("lostpointercapture",up);
  vb.addEventListener("contextmenu",e=>e.preventDefault());
}
function setXYD(c,e){const li=tabLi(),r=c.getBoundingClientRect();const x=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y=Math.max(0,Math.min(1,1-(e.clientY-r.top)/r.height));lay(li).xy={x,y};applyXY(li,x,y);}

// ── Actions ──
async function deskAct(a,t){
  const li=tabLi(),sc=sec(),P=S.song||(S.song=[]),c=ui.selClip!=null?P[ui.selClip]:null;
  const armers=["dclear","lclear"];if(!armers.includes(a)&&ui.arm!==null)ui.arm=null;
  if(songOn&&["rec","moves"].includes(a)){setStatus("Stop the song first.",true);return;}
  switch(a){
    case"playSec":if(songOn)await finishSong(false);else await togglePlay();break;
    case"playSong":if(songOn)await finishSong(false);else await startSong(false,ui.cursor);break;
    case"saveWav":if(songOn)await finishSong(false);else{ui.cursor=0;await startSong(true,0);}break;
    case"rec":await startRec("rec");break;
    case"moves":await startRec("moves");break;
    case"sec":{const k=+t.dataset.i;if(songOn)return;if(playing){queued=k===S.sel?null:k;setStatus(queued!==null?"Section "+SL[k]+" plays at the next loop.":"Playing section "+SL[S.sel]+".");}else{S.sel=k;if(A)syncAll();}break;}
    case"selsec":{if(t.closest("button"))return;const k=+t.dataset.i;if(songOn)return;if(playing){queued=k===S.sel?null:k;}else{S.sel=k;if(A)syncAll();}break;}
    case"tab":releaseAllLive();S.tab=t.dataset.t;break;
    case"bpmDn":case"bpmUp":S.bpm=Math.max(70,Math.min(180,S.bpm+(a==="bpmUp"?5:-5)));syncAll();break;
    case"tap":tapTempo();break;
    case"copy":S.secs[ui.copyTo]=JSON.parse(JSON.stringify(sc));setStatus("Copied "+SL[S.sel]+" to "+SL[ui.copyTo]+".",false,true);break;
    case"addclip":P.push(newPart(+t.dataset.i));ui.selClip=P.length-1;break;
    case"kit":sc.drums=kitDrums(t.dataset.k);S.example=false;break;
    case"dmute":sc.dmute=!sc.dmute;if(A)A.dg.gain.rampTo(sc.dmute?0:sc.dvol,.04);break;
    case"dclear":if(ui.arm==="d"){sc.drums=emptyDrums();ui.arm=null;}else ui.arm="d";break;
    case"snd":lay(li).snd=t.dataset.s;applySound(li);break;
    case"lsub":lay(li).sub=!lay(li).sub;applySound(li);break;
    case"lmute":lay(li).muted=!lay(li).muted;applySound(li);break;
    case"lclear":if(ui.arm===li){lay(li).track=blankTrack(L());ui.arm=null;S.example=false;if(A&&V[li].cur!==null)release(li,Tone.now());}else ui.arm=li;break;
    case"mxm":{const i=+t.dataset.i;if(i===0){sc.dmute=!sc.dmute;if(A)A.dg.gain.rampTo(sc.dmute?0:sc.dvol,.04);}else{sc.layers[i-1].muted=!sc.layers[i-1].muted;applySound(i-1);}break;}
    case"clipsec":if(c){c.sec=+t.dataset.i;}break;
    case"clipup":if(c)c.loops=Math.min(lp(64),c.loops+1);break;
    case"clipdn":if(c)c.loops=Math.max(1,c.loops-1);break;
    case"clipfx":if(c)c[t.dataset.k]=!c[t.dataset.k];break;
    case"clipdup":if(c){P.splice(ui.selClip+1,0,JSON.parse(JSON.stringify(c)));ui.selClip++;}break;
    case"clipdel":if(c){P.splice(ui.selClip,1);ui.selClip=P.length?Math.min(ui.selClip,P.length-1):null;}break;
    case"side":ui.side=t.dataset.v;break;
    case"fxprev":if(ui.selFx)previewFx(ui.selFx.id,ui.selFx);return;
    case"fxpitch":if(ui.selFx){ui.selFx.pitch=Math.max(-12,Math.min(12,(ui.selFx.pitch||0)+(+t.dataset.v)));}break;
    case"fxdel":if(ui.selFx){S.fx.splice(S.fx.indexOf(ui.selFx),1);ui.selFx=null;}break;
    case"fxdup":if(ui.selFx){const o=Object.assign({},ui.selFx,{bar:ui.selFx.bar+Math.ceil(fxBars(ui.selFx)*4)/4,row:null});o.row=freeRow(o.bar,fxBars(o),o);S.fx.push(o);ui.selFx=o;}break;
    case"keydel":if(ui.selKey){const arr=S.auto[ui.selKey.lane],i=arr.indexOf(ui.selKey.o);if(i>=0)arr.splice(i,1);ui.selKey=null;}break;
    case"clearlane":S.auto[t.dataset.k]=[];if(ui.selKey&&ui.selKey.lane===t.dataset.k)ui.selKey=null;break;
    default:return;
  }
  save();renderTop();touch();
}
function bindDesk(){
  const root=$("#desk");
  root.addEventListener("click",e=>{const fc=e.target.closest("[data-fx]");if(fc){previewFx(fc.dataset.fx);return;}const t=e.target.closest("[data-d]");if(!t)return;deskAct(t.dataset.d,t);});
  root.addEventListener("input",e=>{const t=e.target,v=+t.value,sc=sec();
    if(/^dmx\d$/.test(t.id)){t.style.setProperty("--p",Math.round(v*100)+"%");const i=+t.id.slice(3);if(i===0){sc.dvol=v;if(A)A.dg.gain.rampTo(sc.dmute?0:v,.04);}else{sc.layers[i-1].vol=v;applySound(i-1);}save();}
    else if(t.id==="dname"){S.name=t.value;save();return;}
    else if(t.id==="dfxv"&&ui.selFx){ui.selFx.vol=v;t.style.setProperty("--p",Math.round(v/1.5*100)+"%");save();}
    else if(t.id==="dzoom"){ui.barPx=v;t.style.setProperty("--p",Math.round((v-8)/88*100)+"%");sizeTimeline();fitTL();}});
  root.addEventListener("change",e=>{if(e.target.id==="dkey"){S.key=+e.target.value;save();touch();renderSurface();}if(e.target.id==="dcopy")ui.copyTo=+e.target.value;});
  root.addEventListener("dragstart",e=>{const fc=e.target.closest&&e.target.closest("[data-fx]");if(fc){e.dataTransfer.setData("text/wub-fx",fc.dataset.fx);e.dataTransfer.effectAllowed="copy";return;}
    const c=e.target.closest&&e.target.closest("[data-drag]");if(!c)return;e.dataTransfer.setData("text/wub-sec",c.dataset.drag);e.dataTransfer.effectAllowed="copy";});
  bindTimeline();bindViewer();
  document.addEventListener("keydown",async e=>{
    if(!isDesk||ui.sheet)return;const tg=e.target;
    if(tg&&((tg.tagName==="INPUT"&&tg.type!=="range")||tg.tagName==="TEXTAREA"||tg.tagName==="SELECT"))return;
    const k=e.key.toLowerCase();
    if(e.code==="Space"){e.preventDefault();if(!e.repeat)deskAct(e.shiftKey?"playSec":"playSong");return;}
    if((e.ctrlKey||e.metaKey)&&k==="z"){e.preventDefault();undoRedo(e.shiftKey?1:-1);return;}
    if((e.ctrlKey||e.metaKey)&&k==="y"){e.preventDefault();undoRedo(1);return;}
    if((e.ctrlKey||e.metaKey)&&k==="d"){e.preventDefault();deskAct(ui.selFx?"fxdup":"clipdup");return;}
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    if(k==="delete"||k==="backspace"){e.preventDefault();if(ui.selFx)deskAct("fxdel");else if(ui.selKey)deskAct("keydel");else if(ui.selClip!=null)deskAct("clipdel");return;}
    if(e.repeat)return;
    const li=tabLi();
    if(li>=0&&KEYS.includes(k)){e.preventDefault();const i=KEYS.indexOf(k);if(!A){try{await ensureAudio();}catch(x){return;}}
      V[li].held.push({i,id:"k"+k});liveOn(li,i);const el=document.querySelector('#dvbody .pad[data-i="'+i+'"]');el&&el.classList.add("down");return;}
    if(DKEYS.includes(k)){e.preventDefault();if(!A){try{await ensureAudio();}catch(x){return;}}const r=DROWS[DKEYS.indexOf(k)].id;drumTap(r);
      const el=document.querySelector('#dvbody .dpad[data-r="'+r+'"]');if(el){el.classList.add("down");setTimeout(()=>el.classList.remove("down"),110);}touch();return;}
    if("1234".includes(k)&&k.length===1){releaseAllLive();S.tab=k==="1"?"drums":String(+k-2);touch();renderTabs();return;}
    if(k==="r"){deskAct("rec");}
  });
  document.addEventListener("keyup",e=>{
    if(!isDesk)return;const k=e.key.toLowerCase(),li=tabLi();if(li<0||!KEYS.includes(k))return;
    const v=V[li],idx=v.held.findIndex(h=>h.id==="k"+k);if(idx<0)return;const i=v.held[idx].i;v.held.splice(idx,1);
    if(!v.held.some(h=>h.i===i)){const el=document.querySelector('#dvbody .pad[data-i="'+i+'"]');el&&el.classList.remove("down");}if(A)liveOff(li);
  });
}
// keep desktop in sync with every UI refresh
{const _rt=renderTop,_rtb=renderTabs,_rl=renderLbar,_rs=renderSurface,_rsh=renderSheet;
  renderTop=function(){_rt();deskDirty=true;};renderTabs=function(){_rtb();deskDirty=true;};renderLbar=function(){_rl();deskDirty=true;};
  renderSurface=function(){_rs();deskDirty=true;};renderSheet=function(){_rsh();deskDirty=true;};}
{const _ss=setStatus;setStatus=function(t,rec,ok){_ss(t,rec,ok);const d=$("#dstatus");if(d){d.textContent=t;d.className="dstatus"+(rec?" rec":"")+(ok?" ok":"");}};}

if(deskMQ.addEventListener)deskMQ.addEventListener("change",e=>setDesk(e.matches));else deskMQ.addListener(e=>setDesk(e.matches));

setStatus(S.example?"Example drop loaded. Tap Play to hear it.":idleStatus());
requestAnimationFrame(frame);
