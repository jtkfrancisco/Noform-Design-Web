const midiOf=(li,i)=>12*(S.oct+1)+S.key+DEG[i]+(li===2?24:0);

const T=()=>Tone.getTransport();
function makeVoice(li,bus,comp){

  const o2=new Tone.OmniOscillator({type:"sine",frequency:110}).start();

  const drv=new Tone.Distortion({distortion:.2,wet:.5,oversample:"2x"});flt.connect(drv);
  const vca=new Tone.Gain(0);drv.connect(vca);
  const am=new Tone.Gain(1);vca.connect(am);
  const pan=new Tone.Panner(0);am.connect(pan);
  const lg=new Tone.Gain(.55);
  if(li===2){const d=new Tone.FeedbackDelay({delayTime:60/S.bpm*0.75,feedback:.38,wet:.35});pan.connect(d);d.connect(lg);V[li].dly=d;}else pan.connect(lg);

  const d1=new Tone.Add(0),d2=new Tone.Add(0);pit.connect(d1);pit.connect(d2);d1.connect(o1.detune);d2.connect(o2.detune);

  const n={o1,o2,g1,g2,flt,drv,vca,am,pan,lg,wob,amL,pit,d1,d2,panL};

async function ensureAudio(){
  if(A){if(Tone.getContext().state!=="running")await Tone.start();return;}
  try{Tone.setContext(new Tone.Context({latencyHint:"interactive",lookAhead:0.06}));}catch(e){}
  await Tone.start();
  const lim=new Tone.Limiter(-1).toDestination();
  const mgate=new Tone.Gain(1).connect(lim);
  const comp=new Tone.Compressor({threshold:-14,ratio:3,attack:.01,release:.15}).connect(mgate);
  let recDest=null;try{recDest=Tone.getContext().rawContext.createMediaStreamDestination();lim.connect(recDest);}catch(e){}
  const an=new Tone.Analyser("waveform",2048);comp.connect(an);

  const mf=new Tone.Filter({type:"lowpass",frequency:20000,rolloff:-24}).connect(rev);
  const bus=new Tone.Gain(1).connect(mf);
  [0,1,2].forEach(li=>makeVoice(li,bus,comp));
  const dg=new Tone.Gain(.8).connect(bus);
  const kick=new Tone.MembraneSynth({pitchDecay:.045,octaves:6,envelope:{attack:.001,decay:.4,sustain:0,release:.1}});kick.volume.value=2;kick.connect(dg);
  const snBP=new Tone.Filter({type:"bandpass",frequency:2200,Q:.8}).connect(dg);
  const snN=new Tone.NoiseSynth({noise:{type:"white"},envelope:{attack:.001,decay:.18,sustain:0,release:.05}});snN.volume.value=-2;snN.connect(snBP);
  const snB=new Tone.MembraneSynth({pitchDecay:.02,octaves:2,envelope:{attack:.001,decay:.12,sustain:0,release:.05}});snB.volume.value=-6;snB.connect(dg);
  const hat=new Tone.MetalSynth({envelope:{attack:.001,decay:.05,release:.01},harmonicity:5.1,modulationIndex:32,resonance:5000,octaves:1.5});hat.volume.value=-20;hat.connect(dg);
  const clBP=new Tone.Filter({type:"bandpass",frequency:1300,Q:1.2}).connect(dg);
  const clap=new Tone.NoiseSynth({noise:{type:"pink"},envelope:{attack:.003,decay:.14,sustain:0,release:.05}});clap.volume.value=-4;clap.connect(clBP);
  const riserG=new Tone.Gain(0).connect(rev);const riserF=new Tone.Filter({type:"bandpass",frequency:300,Q:1.4}).connect(riserG);new Tone.Noise("white").start().connect(riserF);

}
function applySound(li){
  const v=V[li];if(!v.o1)return;const s=sndOf(li),l=lay(li);
  v.o1.type=s.o1;v.o2.type=s.o2;
  try{if(s.o1==="fmsine"){v.o1.harmonicity.value=li===2?3.5:1;v.o1.modulationIndex.value=li===2?3:6;}if(s.o2==="fmsine"){v.o2.harmonicity.value=2;v.o2.modulationIndex.value=4;}}catch(e){}
  v.g1.gain.value=1-s.mix;v.g2.gain.value=s.mix;v.d2.addend.value=s.det;
  v.flt.type=s.ft;v.flt.Q.value=s.q;
  v.drv.distortion=s.drive;v.drv.wet.value=s.drive>0?Math.min(1,.35+s.drive):0;
  v.wob.type=s.lfo||"sine";
  v.lg.gain.rampTo(l.muted?0:l.vol,.04);
  if(v.sg)v.sg.gain.rampTo(l.muted||!l.sub?0:.55,.04);
  v.panL.frequency.value=S.bpm/60/2;const t=S.tingle*(li===2?.9:.7);v.panL.min=-t;v.panL.max=t;
  if(v.dly)v.dly.delayTime.value=60/S.bpm*.75;
  applyXY(li,l.xy.x,l.xy.y);
}
function syncAll(){if(!A)return;T().bpm.value=S.bpm;[0,1,2].forEach(applySound);A.dg.gain.rampTo(sec().dmute?0:sec().dvol,.04);}
function zone(x){return Math.min(RATES.length-1,Math.floor(x*RATES.length));}
function xyInfo(li,x,y){
  const s=sndOf(li),center=120*Math.pow(8000/120,y);
  if(s.mod==="wob"){const z=zone(x);return{center,label:RATES[z][0],rate:RATES[z][1]};}
  const f=x<.06?0:s.mod==="am"?4*Math.pow(70/4,x):.5*Math.pow(32,x);
  return{center,label:f?(f<2?f.toFixed(1):Math.round(f))+(s.mod==="am"?" Hz chop":" Hz bend"):"Hold",hz:f};
}
function applyXY(li,x,y){
  const v=V[li];if(!v.o1)return;const s=sndOf(li),i=xyInfo(li,x,y),c=i.center;
  if(s.mod==="wob"&&i.rate){const d=s.depth;v.wob.min=Math.max(50,c*(1-.9*d)*.5);v.wob.max=Math.min(15000,c*(1+4*d));v.wob.frequency.value=Tone.Time(i.rate).toFrequency();}

function setFreq(li,i,time,ramp){
  const v=V[li],s=sndOf(li),f=hzOf(li,i);
  const ps=[[v.o1.frequency,f],[v.o2.frequency,f*s.o2x]];if(v.sub)ps.push([v.sub.frequency,f/2]);
  ps.forEach(([p,val])=>{p.cancelScheduledValues(time);if(ramp>0){p.setValueAtTime(p.getValueAtTime(time),time);p.exponentialRampToValueAtTime(val,time+ramp);}else p.setValueAtTime(val,time);});
}
function gates(li){const v=V[li];return v.svca?[v.vca.gain,v.svca.gain]:[v.vca.gain];}
function attack(li,i,time){
  const v=V[li],s=sndOf(li);

  gates(li).forEach(g=>{g.cancelScheduledValues(time);g.setValueAtTime(0,time);g.linearRampToValueAtTime(1,time+s.e.a);});

function glide(li,i,time){setFreq(li,i,time,Math.max(.02,sndOf(li).glide));V[li].cur=i;}
function release(li,time){const r=sndOf(li).e.r;gates(li).forEach(g=>{g.cancelScheduledValues(time);g.setTargetAtTime(0,time,r/3);});V[li].cur=null;}
function hitDrum(r,time,vel=1){

  else if(r==="s"){A.snN.triggerAttackRelease("16n",time,vel);A.snB.triggerAttackRelease("G2","16n",time,vel);}

function click(time,hi){A.hat.triggerAttackRelease(hi?900:500,.03,time,hi?1:.6);}
const drumsEmpty=()=>!Object.values(sec().drums).some(r=>r.some(Boolean));
function switchSec(k,time){
  S.sel=k;[0,1,2].forEach(li=>{if(V[li].cur!==null&&V[li].liveNote===null)release(li,time);applySound(li);});
  A.dg.gain.rampTo(sec().dmute?0:sec().dvol,.04);

function tick(time){

    const n=16-countIn;if(n%4===0)click(time,n===0);countIn--;
    const left=Math.ceil(countIn/4);Tone.Draw.schedule(()=>setStatus(left>0?"Recording in "+left:"Recording",true),time);
    if(countIn===0)gstep=0;return;
  }
  const n=L(),s=gstep%n,ds=s%16;
  if(songOn&&songTick(time,s))return;
  if(s===0&&gstep>0&&queued!==null){const k=queued;queued=null;switchSec(k,time);Tone.Draw.schedule(()=>{renderPanel();renderTop();},time);}
  if(s===0&&armed){recMode=armed.mode;recLi=armed.li;armed=null;Tone.Draw.schedule(()=>{renderTransport();setStatus(recMode==="drums"?"Recording. Tap the drum pads.":recMode==="rec"?"Recording. Play your notes.":"Recording moves. Drag the square.",true);},time);}

async function togglePlay(){

async function startRec(mode){

let taps=[];
function tapTempo(){const t=performance.now();if(taps.length&&t-taps[taps.length-1]>2000)taps=[];taps.push(t);if(taps.length>5)taps.shift();if(taps.length>=3){let sum=0;for(let i=1;i<taps.length;i++)sum+=taps[i]-taps[i-1];S.bpm=Math.max(70,Math.min(180,Math.round(60000/(sum/(taps.length-1)))));syncAll();renderTransport();save();}}

// ═══════ LIVE INPUT ═══════
const stepDur=()=>60/S.bpm/4;
function liveOn(li,i){

}
function liveOff(li){const v=V[li];if(v.held.length){const i=v.held[v.held.length-1].i;glide(li,i,Tone.now());v.liveNote=i;}else{v.liveNote=null;release(li,Tone.now());}}
function drumTap(r){

function releaseAllLive(){[0,1,2].forEach(li=>{const v=V[li];v.held=[];if(v.liveNote!==null){v.liveNote=null;if(A)release(li,Tone.now());}v.xyTouch=false;});document.querySelectorAll(".pad.down").forEach(e=>e.classList.remove("down"));}

function bindSurface(){

    const p=e.target.closest(".pad,.dpad");if(!p)return;e.preventDefault();
    try{p.setPointerCapture(e.pointerId);}catch(x){}

    if(!A){try{await ensureAudio();}catch(x){return showErr(x);}}

function drawXY(){

  if(s===0&&gstep>0){
    sp.loop++;
    if(sp.loop>=S.song[sp.i].loops){
      sp.i++;sp.loop=0;resetMoves(time);
      if(sp.i>=S.song.length){[0,1,2].forEach(li=>{if(V[li].cur!==null)release(li,time);});songEnded=true;later(()=>finishSong(true),time);return true;}
      const p=S.song[sp.i];if(p.sec!==S.sel)switchSec(p.sec,time);
      later(()=>{renderTop();renderTabs();renderLbar();if(ui.sheet==="layer")renderSheet();},time);
    }
    later(()=>{if(songOn)setStatus(songStatus(),songRec);},time);
  }
  const p=S.song[sp.i],n=L();
  if(sp.loop===p.loops-1){
    if(s===n-16)scheduleMoves(p,time);
    if(p.gap&&s===n-4){A.mgate.gain.cancelScheduledValues(time);A.mgate.gain.setValueAtTime(0,time);}
  }
  return false;
}
async function startSong(record){
  if(!S.song||!S.song.length){setStatus("Add a part first.",true);return;}
  try{await ensureAudio();}catch(e){return showErr(e);}
  if(playing)await togglePlay();
  recMode="off";recLi=null;armed=null;queued=null;countIn=0;
  sp={i:0,loop:0};S.sel=S.song[0].sec;syncAll();resetMoves(Tone.now());
  if(record){
    if(!A.recDest||!window.MediaRecorder){setStatus("This browser can't save audio. Try Chrome.",true);return;}
    mchunks=[];try{mrec=new MediaRecorder(A.recDest.stream);}catch(e){setStatus("Could not start saving audio.",true);return;}
    mrec.ondataavailable=ev=>{if(ev.data&&ev.data.size)mchunks.push(ev.data);};
    mrec.start(250);
  }
  songEnded=false;songOn=true;songRec=!!record;
  await togglePlay();
  setStatus(songStatus(),songRec);
  renderTop();renderTabs();renderLbar();renderSurface();renderSheet();
}
let finishing=false;
async function finishSong(complete){
  if(finishing)return;finishing=true;
  const wasRec=songRec;songOn=false;songRec=false;
  if(playing)await togglePlay();
  if(A)resetMoves(Tone.now());
  if(wasRec&&mrec){
    const r=mrec;mrec=null;
    if(!complete){try{r.stop();}catch(e){}setStatus("Save cancelled. Nothing was saved.");}
    else{setStatus("Finishing the file…",true);setTimeout(()=>{r.onstop=()=>exportWav();try{r.stop();}catch(e){exportWav();}},1800);}
  }else setStatus(complete?"Song finished.":"Song stopped.",false,complete);
  finishing=false;renderTop();if(ui.sheet)renderSheet();
}
async function exportWav(){
  try{
    const blob=new Blob(mchunks,{type:mchunks[0]&&mchunks[0].type||"audio/webm"});
    const buf=await Tone.getContext().rawContext.decodeAudioData(await blob.arrayBuffer());
    const wav=encodeWAV(buf),url=URL.createObjectURL(wav),a=document.createElement("a");
    const name=(S.name||"wub1-song").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"-")||"wub1-song";
    a.href=url;a.download=name+"-"+S.bpm+"bpm.wav";document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);
    setStatus("Saved "+a.download+" to your downloads.",false,true);
  }catch(e){setStatus("Could not make the WAV file. Try again.",true);}
}
function encodeWAV(buf){const nCh=buf.numberOfChannels,sr=buf.sampleRate,ns=buf.length,ba=nCh*2,ds=ns*ba,ab=new ArrayBuffer(44+ds),v=new DataView(ab);const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  w(0,"RIFF");v.setUint32(4,36+ds,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,nCh,true);v.setUint32(24,sr,true);v.setUint32(28,sr*ba,true);v.setUint16(32,ba,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,ds,true);
  const ch=[];for(let c=0;c<nCh;c++)ch.push(buf.getChannelData(c));let off=44;for(let i=0;i<ns;i++)for(let c=0;c<nCh;c++){const s=Math.max(-1,Math.min(1,ch[c][i]));v.setInt16(off,s<0?s*0x8000:s*0x7FFF,true);off+=2;}
  return new Blob([ab],{type:"audio/wav"});}
// ═══════ SAVE SLOTS ═══════
const SLOTKEY="noform-wub1-slots",NSLOT=8;
function readSlots(){try{const r=JSON.parse(localStorage.getItem(SLOTKEY)||"null");if(Array.isArray(r)){while(r.length<NSLOT)r.push(null);return r;}}catch(e){}return Array(NSLOT).fill(null);}
function writeSlots(sl){try{localStorage.setItem(SLOTKEY,JSON.stringify(sl));return true;}catch(e){return false;}}
const fmtDate=t=>{try{return new Date(t).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});}catch(e){return "";}};
function slotsHTML(){
  const sl=readSlots();
  return `<div class="grp"><div class="gt">Start fresh</div>
    <div class="row"><button class="btn danger" data-a="newSong">${ui.arm==="new"?"Tap again to clear everything":"New song"}</button><button class="btn danger" data-a="clearSec">${ui.arm==="csec"?"Tap again to clear "+SL[S.sel]:"Clear section "+SL[S.sel]}</button></div>
    <p class="desc">New song empties all four sections. Clear section empties only the one you're on. Neither touches your saved slots, so save first if you want to keep this.</p></div>
  <div class="grp"><div class="gt">Saved songs</div>
    <div class="row"><label class="desc" for="songName">Name</label><input id="songName" type="text" maxlength="28" value="${(S.name||"").replace(/"/g,"&quot;")}" placeholder="My drop" style="flex:1;min-width:0;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font:600 15px var(--sans)"></div>
    <div class="slots">${sl.map((s,i)=>`<div class="slot${s?"":" empty"}">
      <div class="sinfo"><b>${s?esc(s.name||"Untitled"):"Empty slot "+(i+1)}</b><small>${s?fmtDate(s.t)+" · "+s.bpm+" BPM":"Nothing saved here"}</small></div>
      <button class="btn" data-a="slotSave" data-i="${i}">${ui.arm==="s"+i?"Tap to overwrite":"Save"}</button>
      ${s?`<button class="btn" data-a="slotLoad" data-i="${i}">${ui.arm==="l"+i?"Tap to load":"Load"}</button>`:""}
      ${s?`<button class="btn danger" data-a="slotDel" data-i="${i}" aria-label="Delete">${ui.arm==="x"+i?"Delete?":"✕"}</button>`:""}
    </div>`).join("")}</div>
    <p class="desc">Loading replaces what's open now, so save it first. Slots live in this browser on this phone. Clearing the browser's data erases them, so keep a backup code of songs you love.</p></div>
  <div class="grp"><div class="gt">Backup code</div>
    <div class="row"><button class="btn" data-a="codeCopy">Copy song code</button><span class="desc" id="codeMsg"></span></div>
    <textarea id="codeIn" rows="3" placeholder="Paste a song code here" style="width:100%;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:10px;font:13px var(--mono);resize:vertical"></textarea>
    <div class="row"><button class="btn" data-a="codeLoad">${ui.arm==="code"?"Tap to load code":"Load from code"}</button></div>
    <p class="desc">The code is the whole song as text. Paste it in Notes or send it to yourself to keep it safe or move it to another device.</p></div>`;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function snapshot(){const d=JSON.parse(JSON.stringify(S));d.example=false;return d;}
function loadSong(d){
  if(!d||d.v!==2||!Array.isArray(d.secs)||d.secs.length!==4)throw new Error("bad");
  if(playing)togglePlay();
  queued=null;recMode="off";armed=null;countIn=0;
  if(songOn)finishSong(false);
  S=Object.assign({},S,d);if(!Array.isArray(S.song))S.song=[];S.example=false;fitTracks();if(A)syncAll();save();
  renderTop();renderTabs();renderLbar();renderSurface();renderSheet();
}
function renderSheet(){
  const w=$("#sheetwrap");if(!ui.sheet){w.innerHTML="";return;}
  const li=tabLi(),col=li<0?DRUMC:LAYERS[li].c,name=li<0?"Drums":LAYERS[li].n;
  w.innerHTML=`<div class="scrim" data-a="close"></div><div class="sheet" style="--cc:${ui.sheet==="layer"?col:"#4dffb8"}" role="dialog" aria-label="Setup">
    <div class="hd"><button class="seg${ui.sheet==="layer"?" on":""}" data-a="setup">${name}</button><button class="seg${ui.sheet==="arr"?" on":""}" data-a="arr">Arrange</button><button class="seg${ui.sheet==="song"?" on":""}" data-a="song">Settings</button><button class="done" data-a="close">Done</button></div>
    <div class="bd">${ui.sheet==="song"?songSheet():ui.sheet==="arr"?arrangeSheet():layerSheet(li)}</div></div>`;
  lastDS=-1;if(ui.rollPage>=S.bars)ui.rollPage=0;requestAnimationFrame(fit);
}
// names the engine calls
function renderTransport(){renderTop();renderLbar();}
function renderSections(){renderTop();}
function renderPanel(){renderTabs();renderLbar();if(ui.sheet)renderSheet();}
function renderAll(){renderTop();renderTabs();renderLbar();renderSurface();renderSheet();}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-a]");if(!t)return;
  const a=t.dataset.a,li=tabLi(),sc=sec();
  const armers=["dclear","lclear","slotSave","slotLoad","slotDel","codeLoad","newSong","clearSec","tpl"];
  if(!armers.includes(a)&&ui.arm!==null){ui.arm=null;if(ui.sheet&&a!=="close")renderSheet();}
  if(songOn&&["rec","moves","sec"].includes(a)){setStatus("Stop the song first.",true);return;}
  const P=S.song||(S.song=[]),pi=+t.dataset.i;
  switch(a){
    case"play":if(songOn)return void finishSong(false);return void togglePlay();
    case"rec":return void startRec("rec");
    case"moves":return void startRec("moves");
    case"arr":ui.sheet="arr";renderSheet();return;
    case"playSong":if(songOn)return void finishSong(false);return void startSong(false);
    case"saveSong":if(songOn)return void finishSong(false);return void startSong(true);
    case"padd":P.push(newPart(+t.dataset.s));renderSheet();break;
    case"psec":P[pi].sec=(P[pi].sec+1)%4;renderSheet();break;
    case"pup":P[pi].loops=Math.min(lp(64),P[pi].loops+1);renderSheet();break;
    case"pdn":P[pi].loops=Math.max(1,P[pi].loops-1);renderSheet();break;
    case"pdel":P.splice(pi,1);renderSheet();break;
    case"pmove":if(pi>0){const x=P[pi];P[pi]=P[pi-1];P[pi-1]=x;}renderSheet();break;
    case"pfx":P[pi][t.dataset.k]=!P[pi][t.dataset.k];renderSheet();break;
    case"tpl":{if(P.length&&ui.arm!=="tpl"){ui.arm="tpl";renderSheet();return;}ui.arm=null;
      const mk=(sec,bars,fx)=>Object.assign(newPart(sec),{loops:lp(bars)},fx||{});
      S.song=[mk(0,8,{sweep:false}),mk(1,8,{riser:true,roll:true,gap:true}),mk(2,16),mk(0,8),mk(1,8,{riser:true,roll:true,gap:true}),mk(3,16),mk(0,8,{sweep:true})];
      renderSheet();setStatus("Template loaded. Tap Play song.",false,true);break;}
    case"setup":ui.sheet="layer";renderSheet();return;
    case"song":ui.sheet="song";renderSheet();return;
    case"close":ui.sheet=null;renderSheet();return;
    case"bpmDn":case"bpmUp":S.bpm=Math.max(70,Math.min(180,S.bpm+(a==="bpmUp"?5:-5)));syncAll();renderTop();{const o=$("#bpmOut");if(o)o.textContent=S.bpm;}break;
    case"tap":tapTempo();{const o=$("#bpmOut");if(o)o.textContent=S.bpm;}return;
    case"sec":{const k=+t.dataset.i;if(playing){queued=k===S.sel?null:k;renderTop();setStatus(queued!==null?"Section "+SL[k]+" plays at the next loop.":idleStatus());}else{S.sel=k;if(A)syncAll();renderAll();setStatus("Section "+SL[k]+".");}break;}
    case"copy":S.secs[ui.copyTo]=JSON.parse(JSON.stringify(sc));renderTop();setStatus("Copied "+SL[S.sel]+" to "+SL[ui.copyTo]+".",false,true);break;
    case"tab":if(S.tab===t.dataset.t)return;S.tab=t.dataset.t;renderTabs();renderLbar();renderSurface();if(!playing)setStatus(idleStatus());break;
    case"kit":sc.drums=kitDrums(t.dataset.k);S.example=false;renderDGrid();renderTop();setStatus(KITS[t.dataset.k].n+" beat loaded.",false,true);break;
    case"dcell":{const r=t.dataset.r,s=+t.dataset.s;sc.drums[r][s]=!sc.drums[r][s];t.classList.toggle("on");renderTop();break;}
    case"dmute":sc.dmute=!sc.dmute;if(A)A.dg.gain.rampTo(sc.dmute?0:sc.dvol,.04);renderTabs();renderLbar();break;
    case"dclear":if(ui.arm==="d"){sc.drums=emptyDrums();ui.arm=null;renderTop();}else ui.arm="d";renderSheet();break;
    case"snd":lay(li).snd=t.dataset.s;applySound(li);renderTabs();renderLbar();renderSheet();break;
    case"lmute":lay(li).muted=!lay(li).muted;applySound(li);renderTabs();renderLbar();if(ui.sheet)renderSheet();break;
    case"lsub":lay(li).sub=!lay(li).sub;applySound(li);renderSheet();break;
    case"lclear":if(ui.arm===li){lay(li).track=blankTrack(L());ui.arm=null;S.example=false;if(A&&V[li].cur!==null)release(li,Tone.now());renderTop();}else ui.arm=li;renderSheet();break;
    case"octDn":case"octUp":S.oct=Math.max(1,Math.min(4,S.oct+(a==="octUp"?1:-1)));renderSheet();renderSurface();break;
    case"bars":S.bars=+t.dataset.b;fitTracks();renderSheet();break;
    case"rpage":ui.rollPage=+t.dataset.p;renderSheet();return;
    case"newSong":{if(ui.arm!=="new"){ui.arm="new";renderSheet();return;}ui.arm=null;
      loadSong({v:2,bpm:140,key:5,oct:2,bars:2,tingle:.3,sel:0,tab:"drums",name:"",example:false,song:[],secs:[0,1,2,3].map(()=>newSec(32))});
      setStatus("New song. Start with a beat on the Drums tab.",false,true);return;}
    case"clearSec":{if(ui.arm!=="csec"){ui.arm="csec";renderSheet();return;}ui.arm=null;
      if(A)[0,1,2].forEach(li=>{if(V[li].cur!==null)release(li,Tone.now());});
      S.secs[S.sel]=newSec(L());S.example=false;save();renderTop();renderTabs();renderLbar();renderSheet();
      setStatus("Section "+SL[S.sel]+" cleared.",false,true);return;}
    case"slotSave":{const i=+t.dataset.i,sl=readSlots();if(sl[i]&&ui.arm!=="s"+i){ui.arm="s"+i;renderSheet();return;}ui.arm=null;
      const d=snapshot();sl[i]={name:S.name||"Song "+(i+1),t:Date.now(),bpm:S.bpm,data:d};
      if(writeSlots(sl))setStatus("Saved to slot "+(i+1)+".",false,true);else setStatus("Could not save. Phone storage may be full.",true);renderSheet();return;}
    case"slotLoad":{const i=+t.dataset.i;if(ui.arm!=="l"+i){ui.arm="l"+i;renderSheet();return;}ui.arm=null;const sl=readSlots();
      try{loadSong(JSON.parse(JSON.stringify(sl[i].data)));setStatus("Loaded "+(sl[i].name||"slot "+(i+1))+".",false,true);}catch(err){setStatus("That slot could not be loaded.",true);}return;}
    case"slotDel":{const i=+t.dataset.i;if(ui.arm!=="x"+i){ui.arm="x"+i;renderSheet();return;}ui.arm=null;const sl=readSlots();sl[i]=null;writeSlots(sl);renderSheet();return;}
    case"codeCopy":{const code=JSON.stringify(snapshot()),m=$("#codeMsg"),ta=$("#codeIn");
      const fallback=()=>{if(ta){ta.value=code;ta.focus();ta.select();}if(m)m.textContent="Copy did not work. The code is in the box. Select it and copy.";};
      try{navigator.clipboard.writeText(code).then(()=>{if(m)m.textContent="Copied.";}).catch(fallback);}catch(err){fallback();}return;}
    case"codeLoad":{const v=($("#codeIn")||{}).value||"";if(!v.trim()){setStatus("Paste a song code into the box first.",true);return;}
      if(ui.arm!=="code"){ui.arm="code";const keep=v;renderSheet();const ta=$("#codeIn");if(ta)ta.value=keep;return;}ui.arm=null;
      try{loadSong(JSON.parse(v.trim()));setStatus("Song loaded from code.",false,true);}catch(err){setStatus("That code is not a WUB-1 song.",true);}return;}
    default:return;
  }
  save();
});
document.addEventListener("input",e=>{
  const t=e.target;if(t.type!=="range")return;const v=+t.value,o=$("#o-"+t.id);if(o)o.textContent=Math.round(v*100)+"%";
  if(t.id==="dvol"){sec().dvol=v;if(A)A.dg.gain.rampTo(sec().dmute?0:v,.04);}

document.addEventListener("input",e=>{if(e.target.id==="songName"){S.name=e.target.value;save();}});

setStatus(S.example?"Example drop loaded. Tap Play to hear it.":idleStatus());
requestAnimationFrame(frame);
